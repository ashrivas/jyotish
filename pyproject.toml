[project]
name = "jyoti-accuracy-lab"
version = "0.1.0"
description = "Local, evidence-first Jyotish computation and validation workbench"
requires-python = ">=3.13,<3.14"
dependencies = [
  "fastapi==0.159.1", "uvicorn[standard]==0.54.0", "pydantic==2.14.1",
  "pyswisseph==2.10.3.2", "tzdata==2026.5", "timezonefinder==9.1.0",
  "httpx==0.28.1", "pyyaml==6.0.3",
]

[dependency-groups]
dev = ["pytest==9.1.1", "hypothesis==6.170.5", "skyfield==1.55"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.ruff]
target-version = "py313"
line-length = 110

[tool.vercel]
entrypoint = "app.main:app"

[tool.vercel.scripts]
build = "uv run --locked python tools/build_hosted.py"
